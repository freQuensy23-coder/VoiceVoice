name: Manual Test Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: manual-test-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: Harness tests
    if: github.event.pull_request.user.login == 'freQuensy23-coder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install harness
        run: python -m pip install './manual_test[test]'
      - name: Run harness tests
        run: pytest manual_test/tests

  apk:
    name: Build candidate APK
    if: github.event.pull_request.user.login == 'freQuensy23-coder'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload candidate APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload candidate manual-test YAML as inert data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-test-suite
          path: manual_test/tests.yaml
          if-no-files-found: error
          retention-days: 3

name: Android CI

on:
  push:
    branches:
      - main
      - init
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Build debug and release APKs and run lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease lintDebug 2>&1 \
            | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload bounded Gradle build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: error
          retention-days: 3

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare instrumented-test runner and diagnostics
        shell: bash
        run: |
          mkdir -p instrumented-test-diagnostics
          cat > instrumented-test-diagnostics/run.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ./gradlew --no-daemon connectedDebugAndroidTest 2>&1 \
            | tee "$GITHUB_WORKSPACE/instrumented-test-diagnostics/gradle-integration.log"
          SCRIPT
          chmod +x instrumented-test-diagnostics/run.sh

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./instrumented-test-diagnostics/run.sh

      - name: Collect instrumented-test reports
        if: always()
        shell: bash
        run: |
          mkdir -p instrumented-test-diagnostics
          if [[ -d app/build/outputs/androidTest-results/connected ]]; then
            cp -R app/build/outputs/androidTest-results/connected instrumented-test-diagnostics/results
          fi
          if [[ -d app/build/reports/androidTests/connected ]]; then
            cp -R app/build/reports/androidTests/connected instrumented-test-diagnostics/report
          fi
          find app/build -maxdepth 6 -type f -print | sort \
            > instrumented-test-diagnostics/app-build-files.txt || true

      - name: Upload instrumented-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instrumented-test-diagnostics
          path: instrumented-test-diagnostics
          if-no-files-found: error
          retention-days: 3
